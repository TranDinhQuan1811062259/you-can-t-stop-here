<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="winterGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="winterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#winterGlow)">
    <path
      d="M32 56 C30.5 54.5 10 38.5 7 24 C4 13.5 11.5 5 22 5 C26.8 5 30.5 8 32 10.5 C33.5 8 37.2 5 42 5 C52.5 5 60 13.5 57 24 C54 38.5 33.5 54.5 32 56 Z"
      fill="url(#winterGrad)"
    />
  </g>

  <!-- Bông tuyết pha lê lung linh ở trung tâm -->
  <g transform="translate(32, 26)">
    <!-- 6 Cánh tuyết chính -->
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Nhánh hoa tuyết chéo -->
    <circle cx="0" cy="-9" r="1.6" fill="#ffffff" />
    <circle cx="0" cy="9" r="1.6" fill="#ffffff" />
    <circle cx="-8" cy="-4.6" r="1.6" fill="#ffffff" />
    <circle cx="8" cy="4.6" r="1.6" fill="#ffffff" />
    <circle cx="-8" cy="4.6" r="1.6" fill="#ffffff" />
    <circle cx="8" cy="-4.6" r="1.6" fill="#ffffff" />
    <!-- Tâm tuyết -->
    <circle cx="0" cy="0" r="2.8" fill="#e0f2fe" />
    <circle cx="0" cy="0" r="1.2" fill="#0284c7" />
  </g>
</svg>

