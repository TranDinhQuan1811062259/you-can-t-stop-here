<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="summerGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="summerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#summerGlow)">
    <path
      d="M32 56 C30.5 54.5 10 38.5 7 24 C4 13.5 11.5 5 22 5 C26.8 5 30.5 8 32 10.5 C33.5 8 37.2 5 42 5 C52.5 5 60 13.5 57 24 C54 38.5 33.5 54.5 32 56 Z"
      fill="url(#summerGrad)"
    />
  </g>

  <!-- Biểu tượng mặt trời rực rỡ ở trung tâm -->
  <g transform="translate(32, 26)">
    <!-- Vòng tròn mặt trời -->
    <circle cx="0" cy="0" r="7.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#fef08a" />
    <!-- 8 Tia nắng -->
    <line x1="0" y1="-12" x2="0" y2="-9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="9" x2="0" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-12" y1="0" x2="-9" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="9" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-8.5" y1="-8.5" x2="-6.4" y2="-6.4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6.4" y1="6.4" x2="8.5" y2="8.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8.5" y1="-8.5" x2="6.4" y2="-6.4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-6.4" y1="6.4" x2="-8.5" y2="8.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
