<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="springGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <filter id="springGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ec4899" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#springGlow)">
    <path
      d="M32 56 C30.5 54.5 10 38.5 7 24 C4 13.5 11.5 5 22 5 C26.8 5 30.5 8 32 10.5 C33.5 8 37.2 5 42 5 C52.5 5 60 13.5 57 24 C54 38.5 33.5 54.5 32 56 Z"
      fill="url(#springGrad)"
    />
  </g>

  <!-- Đóa hoa anh đào mùa xuân ở trung tâm -->
  <g transform="translate(32, 26)">
    <!-- 5 Cánh hoa đào -->
    <circle cx="0" cy="-9" r="6" fill="#ffffff" opacity="0.95" />
    <circle cx="8.5" cy="-2.8" r="6" fill="#ffffff" opacity="0.95" />
    <circle cx="5.3" cy="7.3" r="6" fill="#ffffff" opacity="0.95" />
    <circle cx="-5.3" cy="7.3" r="6" fill="#ffffff" opacity="0.95" />
    <circle cx="-8.5" cy="-2.8" r="6" fill="#ffffff" opacity="0.95" />
    <!-- Nhụy hoa -->
    <circle cx="0" cy="0" r="3.2" fill="#fde047" />
    <circle cx="0" cy="0" r="1.5" fill="#f59e0b" />
  </g>
</svg>

