<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient Trái Tim 3D Sang Trọng -->
    <linearGradient id="heartGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Quầng Sáng Tỏa Nhiệt -->
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#e11d48" flood-opacity="0.45" />
    </filter>

    <!-- Ánh Sáng Phản Chiếu Bề Mặt (Gloss Highlight) -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gradient Đôi Cánh Tự Do Vươn Cao -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- Bóng đổ và nền Trái Tim Tinh Tế -->
  <g filter="url(#tabGlow)">
    <!-- Trái tim cách điệu bo tròn hiện đại -->
    <path
      d="M32 56 C30.5 54.5 10 38.5 7 24 C4 13.5 11.5 5 22 5 C26.8 5 30.5 8 32 10.5 C33.5 8 37.2 5 42 5 C52.5 5 60 13.5 57 24 C54 38.5 33.5 54.5 32 56 Z"
      fill="url(#heartGrad)"
    />

    <!-- Ánh sáng phản chiếu mặt cong 3D -->
    <path
      d="M10 21 C12 11.5 18 8 23 8 C27 8 29.5 10.5 30.5 12.5 C26 12 18 16 13 25 C11.5 28 10 26 10 21 Z"
      fill="url(#glossGrad)"
    />
  </g>

  <!-- Đôi cánh tự do / Cánh chim vươn lên (Freedom Soaring Wing) -->
  <path
    d="M32 17 L24 28 C26.5 28 30 26.5 32 23 C34 26.5 37.5 28 40 28 Z"
    fill="url(#wingGrad)"
    opacity="0.95"
  />
  <path
    d="M32 26 L26 36 C28.5 36 30.8 34.5 32 32 C33.2 34.5 35.5 36 38 36 Z"
    fill="#ffffff"
    opacity="0.9"
  />
  <circle cx="32" cy="18" r="2.2" fill="#fff" />
</svg>
